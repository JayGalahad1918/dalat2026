<script>

e=\"font-size: 13px; color: #5a4128\">{{d.sub}}</span>\n</div>\n{{ROWS}}\n</section>\n", "row": "<a href=\"{{r.url}}\" target=\"_blank\" rel=\"noopener\" style=\"display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 8px 2px; border-top: 1px dashed #b8a57c; color: #2a2520; text-decoration: none\">\n<span style=\"flex: none; width: 26px; height: 26px; border-radius: {{r.radius}}; background: {{r.badge}}; color: #f7ecd0; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', Georgia, serif; font-size: 13px; font-weight: 700\">{{r.num}}</span>\n<span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n<span style=\"font-size: 12px; color: #8a4a12\">{{r.time}}</span>\n<span style=\"font-size: 15px; font-weight: 600; line-height: 1.3\">{{r.name}}</span>\n<span style=\"font-size: 12px; color: #5a4a35; line-height: 1.45\">{{r.addr}}</span>\n</span>\n</a>\n"};
function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fill(tpl, name, obj) { return tpl.replace(/\{\{\s*([\w.]+)\s*\}\}/g, function (m, k) { var parts = k.split('.'); if (parts[0] !== name) return m; var v = obj; for (var i = 1; i < parts.length; i++) v = v == null ? '' : v[parts[i]]; return esc(v); }); }
function compute() {

    const gm = (q) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q + ', Đà Lạt');
    // x, y: hand-placed on the antique sheet (directions follow real coordinates, distances do not)

    const P = {
      home: { n: 'Nhà chung · Wind In Dalat', a: '22 Ngô Huy Diễn, Cam Ly', x: 128, y: 283, lab: 'Nhà chung', lx: 0, ly: -20, al: 'm' },
      ben: { n: 'Bến xe An Anh', a: '4C Yersin, P.10 (xác nhận khi đặt vé)', x: 250, y: 294, lab: 'Bến xe', lx: 14, ly: 0, al: 's' },
      phuonglan: { n: 'Phượng Lan 2009', a: 'Lô 5 Hoàng Văn Thụ, P.4', x: 146, y: 316, lab: 'Phượng Lan', lx: 0, ly: 22, al: 'm', url: 'https://maps.app.goo.gl/rjMjZNR5pUYAHWdS9' },

      grove: { n: 'Romantic Grove', a: 'Hẻm 32 Đường 3/4', x: 184, y: 420, lab: 'Romantic Grove', lx: 15, ly: 0, al: 's' },
      dinh: { n: 'Dinh Bảo Đại III', a: '1 Triệu Việt Vương', x: 145, y: 364, lab: 'Dinh Bảo Đại III', lx: -15, ly: 0, al: 'e' },

      pizza: { n: 'Pizza Stop', a: '76 Hoàng Văn Thụ, Cam Ly', x: 100, y: 300, lab: 'Pizza Stop', lx: -15, ly: 0, al: 'e' },
      mongo: { n: 'Mongoland', a: 'Tổ 16, thôn 1, Tà Nung', x: 42, y: 354, lab: 'Mongoland', lx: 4, ly: 23, al: 'm' },

      bacan: { n: 'Bún Miến Ngan Bà Cấn', a: '3 Phó Đức Chính', x: 168, y: 264, lab: 'Bà Cấn', lx: 0, ly: 21, al: 'm' },
      nook: { n: 'Nook Dã Chiến', a: 'Đồi Dã Chiến, Xuân Trường', x: 304, y: 307, lab: 'Nook', lx: 14, ly: 0, al: 's' },
      lau: { n: 'Lẩu Gà Rau Lỗ Bình', a: 'Hẻm 86 Khe Sanh, Xuân Hương', x: 248, y: 353, lab: 'Lẩu gà Lỗ Bình', lx: -15, ly: 0, al: 'e' }
    };
    Object.keys(P).forEach((k) => { const p = P[k]; p.url = p.url || gm(p.n.replace(' (dự phòng)', '') + ' ' + p.a); });
    const pct = (v, t) => (v / t * 100).toFixed(2) + '%';
    const DAYS = [
      { n: 1, color: '#a16207', title: 'Ngày 1', sub: 'Thứ Sáu 04.12 · ~50 km',
        route: ['ben', 'home', 'phuonglan', 'quyen', 'grove', 'home', 'mongo', 'home', 'pacho', 'qt', 'home'],
        rows: [['ben', '', '06:00 · Xuống xe'], ['home', 'H', '06:00 · Về nhà gửi đồ'], ['phuonglan', 1, '07:00 · Ăn sáng'], ['quyen', 2, '08:00 · Cà phê'], ['grove', 3, '10:00 · Cà phê, 12:00 ăn trưa'], ['home', 'H', '14:00 · Nhận phòng, thay đồ'], ['mongo', 4, '15:00 · Chụp ảnh'], ['home', 'H', '17:00 · Thay đồ'], ['pacho', 5, '18:00 · Ăn tối'], ['qt', 6, '20:00 · Đi dạo']] },
      { n: 2, color: '#8b1e2d', title: 'Ngày 2', sub: 'Thứ Bảy 05.12 · ~39 km',
        route: ['home', 'honbo', 'bami', 'nhan', 'pizza', 'dinh', 'chao', 'home'], backup: ['home', 'ngoaio'],

      { n: 3, color: '#1e3a6e', title: 'Ngày 3', sub: 'Chủ nhật 06.12 · ~24 km',
        route: ['home', 'bacan', 'nook', 'home', 'lau', 'ben'],
        rows: [['bacan', 1, '08:00 · Ăn sáng'], ['nook', 2, '09:00 · Cà phê'], ['home', 'H', '11:30 · Trả phòng, trả xe'], ['lau', 3, '12:00 · Ăn trưa'], ['ben', 4, '15:00 · Lên xe về Sài Gòn']] }

    const vis = (n) => sel === 0 || sel === n;
    const curve = (ids) => {

        const a = P[ids[i - 1]];
        const dx = p.x - a.x, dy = p.y - a.y, sgn = i % 2 ? 1 : -1;
        const cx = (a.x + p.x) / 2 - dy * 0.2 * sgn, cy = (a.y + p.y) / 2 + dx * 0.2 * sgn;
        d += ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + p.x + ' ' + p.y;
      });
      return d;
    };
    const routes = { d1: curve(DAYS[0].route), d2: curve(DAYS[1].route), d2b: curve(DAYS[1].backup), d3: curve(DAYS[2].route),
      o1: vis(1) ? 0.9 : 0.12, o2: vis(2) ? 0.9 : 0.12, o3: vis(3) ? 0.9 : 0.12 };
    const pins = []; const dayOf = {};
    let k = 0;
    DAYS.forEach((D) => D.rows.forEach(([id, num]) => {
      if (!id || num === 'H' || num === '') return;
      const p = P[id]; k += 1;
      (dayOf[id] = dayOf[id] || []).push(D.n);
      pins.push({ left: pct(p.x, W), top: pct(p.y, H), color: D.color, num, url: p.url,
        title: D.title + ' · ' + num + ' · ' + p.n, aria: D.title + ', điểm ' + num + ': ' + p.n + ', mở Google Maps',
        op: vis(D.n) ? 1 : 0.15, z: vis(D.n) ? 4 : 2, delay: (0.4 + k * 0.07).toFixed(2) + 's' });
    }));
    const tfs = { s: 'translate(0, -50%)', m: 'translate(-50%, -50%)', e: 'translate(-100%, -50%)' };
    const labels = Object.keys(P).map((id) => {
      const p = P[id]; const ds = id === 'home' ? [0] : (dayOf[id] || []);
      const on = id === 'home' || ds.some((n) => vis(n));
      return { left: pct(p.x + p.lx, W), top: pct(p.y + p.ly, H), tf: tfs[p.al], text: p.lab, op: on ? 1 : 0.3 };
    });
    const days = DAYS.map((D) => ({
      title: D.title, sub: D.sub, color: D.color, show: vis(D.n),
      rows: D.rows.map(([id, num, t]) => {
        const p = P[id];
        return { num: num === 'H' ? '⌂' : (num === '' ? '·' : num), time: t, name: p.n, addr: p.a, url: p.url,
          badge: num === 'H' || num === '' ? '#3b2a17' : D.color, radius: num === 'H' ? '6px' : '50%' };
      })
    }));
    const fdefs = [[0, 'Tất cả', '#f5b301'], [1, 'Ngày 1', '#a16207'], [2, 'Ngày 2', '#8b1e2d'], [3, 'Ngày 3', '#1e3a6e']];
    const filters = fdefs.map(([n, label, color]) => ({
      label, color, pressed: sel === n ? 'true' : 'false', ring: sel === n ? '#f5b301' : '#2f5a43',
      bg: sel === n ? color : 'rgba(12,36,25,0.75)', n
    }));
    const home = { left: pct(P.home.x, W), top: pct(P.home.y, H), url: P.home.url };
    return { filters, routes, pins, labels, days, home };
}
function draw() {
  var V = compute();
  document.getElementById('filters-host').innerHTML = V.filters.map(function (b) { return fill(TPL.filters, 'b', b); }).join('');
  document.getElementById('labels-host').innerHTML = V.labels.map(function (l) { return fill(TPL.labels, 'l', l); }).join('');
  document.getElementById('pins-host').innerHTML = V.pins.map(function (p) { return fill(TPL.pins, 'p', p); }).join('');
  document.getElementById('days-host').innerHTML = V.days.filter(function (d) { return d.show; }).map(function (d) {
    return fill(TPL.day, 'd', d).replace('{{ROWS}}', d.rows.map(function (r) { return fill(TPL.row, 'r', r); }).join(''));
  }).join('');
  ['d1','d2','d2b','d3'].forEach(function (k) { var el = document.getElementById('route-' + k); if (el) el.setAttribute('d', V.routes[k]); });
  document.querySelectorAll('[data-op]').forEach(function (el) { el.setAttribute('opacity', V.routes[el.getAttribute('data-op')]); });
  var h = document.getElementById('homePin'); h.href = V.home.url; h.style.left = V.home.left; h.style.top = V.home.top;
  document.querySelectorAll('#filters-host [data-day]').forEach(function (btn) {
    btn.addEventListener('click', function () { SEL = Number(btn.getAttribute('data-day')); draw(); });
  });
}
draw();
})();
</script>
